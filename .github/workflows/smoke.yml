name: smoke-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: API smoke test
        run: |
          python -m uvicorn apps.api.main:app --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/api/status > /tmp/status.json && break
            sleep 1
          done
          python - <<'PY'
          import json
          d = json.load(open("/tmp/status.json", encoding="utf-8"))
          assert d["hubs"] == 31, d
          assert d["sources"]["driving"] in ("estimate", "amap", "amap+estimate"), d
          print("smoke ok:", d)
          PY

      - name: Static page smoke test
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/)
          test "$code" = "200" || { echo "GET / returned $code"; exit 1; }
          echo "static page ok"
